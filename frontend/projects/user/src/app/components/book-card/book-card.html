<div class="book">
  <mat-card>
    <mat-card-header>
      {{title()}} - {{author()}}
    </mat-card-header>
    <mat-card-content>
      {{description()}}
      <br/>
      {{releaseDate()}}
    </mat-card-content>

    <mat-card-actions class="book-actions">
      <button (click)="borrow()">Borrow</button>
    </mat-card-actions>
  </mat-card>
</div>
